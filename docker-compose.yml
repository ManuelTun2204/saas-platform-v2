version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: saas-backend
    ports:
      - "8000:8000"
    environment:
      environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      RESEND_API_KEY: ${RESEND_API_KEY}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
    volumes:
      - ./data:/app/data
    restart: always
    networks:
      - saas-network

volumes:
  postgres_data:

networks:
  saas-network:
    driver: bridge