version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: saas-backend
    ports:
      - "8000:8000"
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_KEY: ${SUPABASE_KEY}
    volumes:
      - ./data:/app/data
    depends_on:
      - postgres
    restart: always
    networks:
      - saas-network

  typebot-builder:
    image: baptistearno/typebot-builder:latest
    container_name: saas-typebot-builder
    ports:
      - "3001:3000"
    environment:
      DATABASE_URL: postgresql://admin:supersecret@postgres:5432/typebot
      NEXTAUTH_URL: http://localhost:3001
      NEXTAUTH_SECRET: supersecret_nextauth
      NEXT_PUBLIC_VIEWER_URL: http://localhost:3002
    depends_on:
      - postgres
    restart: always
    networks:
      - saas-network

  typebot-viewer:
    image: baptistearno/typebot-viewer:latest
    container_name: saas-typebot-viewer
    ports:
      - "3002:3000"
    environment:
      DATABASE_URL: postgresql://admin:supersecret@postgres:5432/typebot
    depends_on:
      - postgres
    restart: always
    networks:
      - saas-network

  postiz:
    image: ghcr.io/gitroomhq/postiz-app:latest
    container_name: saas-postiz
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://admin:supersecret@postgres:5432/postiz
      JWT_SECRET: supersecret_jwt
    depends_on:
      - postgres
    restart: always
    networks:
      - saas-network

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: saas-n8n
    ports:
      - "5678:5678"
    environment:
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: admin
      N8N_BASIC_AUTH_PASSWORD: admin123
    volumes:
      - ./n8n_data:/home/node/.n8n
    restart: always
    networks:
      - saas-network

  postgres:
    image: postgres:15-alpine
    container_name: saas-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: supersecret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    networks:
      - saas-network

volumes:
  postgres_data:

networks:
  saas-network:
    driver: bridge
