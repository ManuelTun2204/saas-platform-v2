services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: saas-backend
    ports:
      - "8000:8000"
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      RESEND_API_KEY: ${RESEND_API_KEY}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      PUBLIC_URL: ${PUBLIC_URL}
      PAYMENT_PROVIDERS: ${PAYMENT_PROVIDERS:-all}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN}
      MP_PUBLIC_KEY: ${MP_PUBLIC_KEY}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET}
      PAYPAL_API_BASE: ${PAYPAL_API_BASE:-https://api-m.sandbox.paypal.com}
      PRICE_FULL: ${PRICE_FULL:-399}
      PRICE_WEB_CHAT: ${PRICE_WEB_CHAT:-249}
      PRICE_CHAT_ONLY: ${PRICE_CHAT_ONLY:-99}
      LLM_SITE_MODEL: ${LLM_SITE_MODEL:-qwen/qwen3-30b-a3b-instruct-2507}
      LLM_CHAT_MODEL: ${LLM_CHAT_MODEL:-qwen/qwen3-30b-a3b-instruct-2507}
      LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-meta-llama/llama-3.1-8b-instruct}
      HF_HUB_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
    volumes:
      - ./data:/app/data
      - ./cliente-demo:/app/cliente-demo
    restart: always
    networks:
      - saas-network

networks:
  saas-network:
    driver: bridge
