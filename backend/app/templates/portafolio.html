<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ company_name }} | Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family={{ font_family | replace(' ', '+') }}:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: {{ primary_color }}; --dark: #0f172a; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: '{{ font_family }}', sans-serif; line-height: 1.7; color: #334155; background: #fff; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 2rem; }
        nav { background: white; padding: 1rem 0; position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid #e2e8f0; }
        nav .container { display: flex; justify-content: space-between; align-items: center; }
        nav .logo { font-size: 1.5rem; font-weight: 800; color: var(--dark); }
        .hero { background: linear-gradient(135deg, rgba(15, 23, 42, 0.85), rgba(15, 23, 42, 0.7)), url('{{ hero_image }}'); background-size: cover; background-position: center; color: white; padding: 6rem 0; text-align: center; }
        .hero h1 { font-size: 3.5rem; font-weight: 800; margin-bottom: 1rem; }
        .portfolio-section { padding: 6rem 0; }
        .portfolio-section h2 { text-align: center; font-size: 2.5rem; font-weight: 800; color: var(--dark); margin-bottom: 4rem; }
        .portfolio-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 2rem; }
        .project-card { position: relative; height: 400px; border-radius: 24px; overflow: hidden; cursor: pointer; box-shadow: 0 20px 40px -10px rgba(0,0,0,0.15); }
        .project-card img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s; }
        .project-card:hover img { transform: scale(1.05); }
        .project-overlay { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(to top, rgba(15, 23, 42, 0.95), transparent); color: white; padding: 3rem 2rem 2rem; transform: translateY(20px); opacity: 0; transition: all 0.4s; }
        .project-card:hover .project-overlay { transform: translateY(0); opacity: 1; }
        .project-overlay h3 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; }
        footer { background: var(--dark); color: white; padding: 3rem 0; text-align: center; }
        .badge { position: fixed; top: 20px; right: 20px; background: white; color: var(--dark); padding: 8px 16px; border-radius: 20px; font-weight: 700; font-size: 0.85rem; z-index: 9999; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        @media (max-width: 768px) { .hero h1 { font-size: 2.5rem; } }
    </style>
</head>
<body>
    <div class="badge">✨ DISEÑO PREMIUM: PORTFOLIO</div>
    <nav><div class="container"><div class="logo">{{ company_name }}</div></div></nav>
    <section class="hero"><div class="container"><h1>{{ company_name }}</h1><p>{{ tagline }}</p></div></section>
    <section class="portfolio-section">
        <div class="container">
            <h2>Nuestros Proyectos Destacados</h2>
            <div class="portfolio-grid">
                {% for page in pages %}
                <div class="project-card">
                    <img src="https://images.unsplash.com/photo-1498050108023-c5e131434b23?auto=format&fit=crop&w=800&q=80" alt="{{ page.title }}">
                    <div class="project-overlay">
                        <h3>{{ page.title }}</h3>
                        <p>{{ page.content }}</p>
                    </div>
                </div>
                {% endfor %}
            </div>
        </div>
    </section>
    <footer><div class="container"><p>&copy; 2026 {{ company_name }}. Todos los derechos reservados.</p></div></footer>
    <script src="http://localhost/chatbot-platform/frontend/chatbot-widget/widget.js"></script>
    <script>initChatbot({ tenantId: "{{ tenant_id }}", apiHost: "http://localhost:8000", primaryColor: "{{ primary_color }}", welcomeMessage: "{{ welcome_message }}" });</script>
</body>
</html>
